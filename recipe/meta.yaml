{% set name = "coordinatesconverter" %}
{% set version = "0.1.5" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/CoordinatesConverter-{{ version }}.tar.gz
  sha256: ea0348c97569a6aaffac6406bdb4a260ea5f3e141d52a88cbdc9bb638667e494

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - numpy
    - shapely
    
test:
  imports:
    - CoordinatesConverter
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}


about:
  home: https://github.com/ni1o1/CoordinatesConverter
  summary: A tool to convert coordinates between WGS84 GCJ02 and BD09
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ni1o1
